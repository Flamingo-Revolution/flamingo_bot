<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ask Diella – Flamingo Style about the Flamingo Revolution, Diaspora Zbarkon, and the movement's public sources."
    />
    <link rel="icon" href="data:," />
    <title>Diella – Flamingo Style</title>
    <style>
      :root {
        color: #211e1c;
        background: #f8f3ef;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 12% 12%, rgb(217 35 102 / 14%), transparent 32rem),
          linear-gradient(145deg, #fffdfb, #f3eae4);
      }

      main {
        width: min(44rem, calc(100% - 3rem));
        margin: 0 auto;
        padding: clamp(3rem, 10vh, 7rem) 0;
      }

      .mark {
        display: grid;
        width: 3rem;
        height: 3rem;
        margin-bottom: 1.5rem;
        place-items: center;
        border-radius: 50%;
        background: #d92366;
        color: white;
        font-size: 1.35rem;
        font-weight: 800;
      }

      h1 {
        max-width: 13ch;
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5.5rem);
        line-height: 0.96;
        letter-spacing: -0.055em;
      }

      p {
        max-width: 38rem;
        margin: 1.5rem 0 0;
        color: #6f6762;
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.65;
      }

      a {
        color: #a90f4a;
        font-weight: 650;
      }

      @media (max-width: 38rem) {
        main {
          width: min(100% - 2rem, 44rem);
          padding-top: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">F</div>
      <h1>Diella – Flamingo Style</h1>
      <p>
        A source-grounded assistant for the
        <a href="https://www.flamingorevolution.eu/">Flamingo Revolution</a> and
        <a href="https://www.diaspora-zbarkon.com/">Diaspora Zbarkon</a>. Ask in Albanian,
        English, or your preferred language.
      </p>
    </main>
    <flamingo-chat></flamingo-chat>
    <script type="module" src="/widget/flamingo-chat.js"></script>
    <script type="module" src="/widget/standalone.js"></script>
  </body>
</html>
