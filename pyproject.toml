[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flamingo-bot"
version = "0.1.0"
description = "Source-grounded RAG chatbot for Flamingo Revolution and Diaspora Zbarkon"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.116,<1",
  "google-cloud-firestore>=2.28.1,<3",
  "openai>=2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "pyyaml>=6.0.2,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
flamingo-ingest = "flamingo_bot.ingest:main"
flamingo-rollback = "flamingo_bot.rollback:main"

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flamingo_bot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: requires configured, billable external services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["flamingo_bot"]
