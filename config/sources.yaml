version: 1
sources:
  - id: flamingo-dossier
    label: Flamingo Dossier
    repository_setting: flamingo_dossier_repo
    language: sq
    base_url: https://flamingo-revolution.github.io/flamingo-dossier/
    rules:
      - parser: dossier_csv
        include:
          - data/dosje.csv
        options:
          relations_path: data/lidhje.csv

  - id: flamingo-revolution
    label: Flamingo Revolution
    repository_setting: flamingo_revolution_repo
    language: sq
    base_url: https://www.flamingorevolution.eu/
    rules:
      - parser: text
        include:
          - public/llms.txt
      - parser: markdown
        include:
          - src/content/**/*.md
      - parser: typescript_strings
        include:
          - src/data/*.ts
        exclude:
          - src/data/navIcons.ts
          - src/data/referendum.ts
          - src/data/socialIcons.ts
      - parser: pdf
        include:
          - public/documents/**/*.pdf
          - public/referendum/**/*.pdf
      # Published articles live in the site's CMS database, outside this Git
      # checkout. Fetch only public /news/ pages during each ingestion run.
      - parser: public_news
        include: []
      # A dated, one-time snapshot of the separate referendum site.
      - parser: snapshot_markdown
        include:
          - referendum21/*.md
        options:
          root: content/snapshots

  - id: diaspora-zbarkon
    label: Diaspora Zbarkon
    repository_setting: diaspora_zbarkon_repo
    language: sq
    base_url: https://www.diaspora-zbarkon.com/
    rules:
      - parser: markdown
        include:
          - specs/Mission.md
      - parser: typescript_strings
        include:
          - lib/content.ts
        exclude:
          - data/scandals.ts
      # Structured series, with separate dated records in each published language.
      # Methodology comes from the series rather than conditional UI labels.
      - parser: participation_days
        include:
          - data/participation.ts
      # The author's one-time analysis of the Pulsi series.
      - parser: snapshot_markdown
        include:
          - pulsi-reddit/*.md
        options:
          root: content/snapshots

  # Keep the existing retrieval ID and repository revision, but cite the guide
  # itself rather than the homepage. Short contact-directory fields are not
  # retained by the generic text parser; visitors should check the live guide.
  - id: diaspora-zbarkon
    label: Diaspora Zbarkon
    repository_setting: diaspora_zbarkon_repo
    language: sq
    base_url: https://www.diaspora-zbarkon.com/siguria/
    rules:
      - parser: typescript_strings
        include:
          - lib/safety-content.ts

  # Shares the Revolution retrieval filter so the currently deployed service
  # can use map evidence immediately, while keeping its own Git revision.
  - id: flamingo-revolution
    label: Harta e Protestave
    repository_setting: flamingo_map_repo
    revision_key: flamingo-map
    language: sq
    base_url: https://www.flamingorevolution.eu/harta/
    rules:
      - parser: map_json
        include:
          - data/locations.json

  # Author research is not a Git checkout. Fingerprint only these source indexes
  # and ingest their attributed public-report summaries, never local model data.
  - id: diaspora-zbarkon
    label: Protest research
    repository_setting: flamingo_research_dir
    revision_key: protest-research
    versioning: content_hash
    optional: true
    language: en
    base_url: https://www.diaspora-zbarkon.com/pulsi/
    rules:
      - parser: protest_research
        include:
          - research/day_*_sources.json

  # Local expanded references only: title, date and publisher-provided intro.
  # The collector's checkpoint is deliberately outside this fingerprint.
  - id: lapsi
    label: Lapsi.al
    repository_setting: flamingo_lapsi_dir
    revision_key: lapsi-references
    versioning: content_hash
    optional: true
    language: sq
    base_url: https://lapsi.al/
    rules:
      - parser: lapsi_reference
        include:
          - index.json
