version: 1
sources:
  - id: flamingo-dossier
    label: Flamingo Dossier
    repository_setting: flamingo_dossier_repo
    language: sq
    base_url: https://flamingo-revolution.github.io/flamingo-dossier/
    rules:
      - parser: dossier_csv
        include:
          - data/dosje.csv
        options:
          relations_path: data/lidhje.csv

  - id: flamingo-revolution
    label: Flamingo Revolution
    repository_setting: flamingo_revolution_repo
    language: sq
    base_url: https://www.flamingorevolution.eu/
    rules:
      - parser: text
        include:
          - public/llms.txt
      - parser: markdown
        include:
          - src/content/**/*.md
      - parser: typescript_strings
        include:
          - src/data/*.ts
        exclude:
          - src/data/navIcons.ts
          - src/data/referendum.ts
          - src/data/socialIcons.ts
      - parser: pdf
        include:
          - public/documents/**/*.pdf
          - public/referendum/**/*.pdf
      # Published articles live in the site's CMS database, outside this Git
      # checkout. Fetch only public /news/ pages during each ingestion run.
      - parser: public_news
        include: []
      # A dated, one-time snapshot of the separate referendum site.
      - parser: snapshot_markdown
        include:
          - referendum21/*.md
        options:
          root: content/snapshots

  - id: diaspora-zbarkon
    label: Diaspora Zbarkon
    repository_setting: diaspora_zbarkon_repo
    language: sq
    base_url: https://www.diaspora-zbarkon.com/
    rules:
      - parser: markdown
        include:
          - specs/Mission.md
      - parser: typescript_strings
        include:
          - lib/content.ts
          # Visitor-facing /pulsi copy, including the bilingual methodology note
          # and the accuracy caveat shown under the chart.
          - components/live-tracker-page.tsx
        exclude:
          - data/scandals.ts
      # Structured series. The generic string extractor drops every figure and
      # date here, so this file gets a parser that reads the structure.
      - parser: participation_ts
        include:
          - data/participation.ts
      # The author's one-time analysis of the Pulsi series.
      - parser: snapshot_markdown
        include:
          - pulsi-reddit/*.md
        options:
          root: content/snapshots

  # Shares the Revolution retrieval filter so the currently deployed service
  # can use map evidence immediately, while keeping its own Git revision.
  - id: flamingo-revolution
    label: Harta e Protestave
    repository_setting: flamingo_map_repo
    revision_key: flamingo-map
    language: sq
    base_url: https://www.flamingorevolution.eu/harta/
    rules:
      - parser: map_json
        include:
          - data/locations.json
