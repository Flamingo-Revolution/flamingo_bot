version: 1
description: Multi-turn API regressions replaying actual backend answers; semantic grounding requires
  manual review.
cases:
- id: pulsi-escalation-sq
  turns:
  - id: pulsi-escalation-sq-turn-1
    question: Cila ishte dita më e madhe sipas indeksit Pulsi?
    min_citations: 1
    max_citations: 7
    expect_citation_markers: true
    manual_review:
    - Names 20 June 2026 / day 21 and index 100, not 100 people.
    - Describes a normalized model estimate, not an official headcount.
    - 'Relevant retrieved and cited evidence must match at least one source selector: [{"title":
      "Pulsi|pjesëmarr|participation"}, {"record": "^pulsi-day-21$"}]'
  - id: pulsi-escalation-sq-turn-2
    question: Pse u be e dhunshme kaq papritur
    min_citations: 1
    max_citations: 7
    expect_citation_markers: true
    manual_review:
    - Recognizes a change to protest escalation rather than participation measurement.
    - Does not assume the peak participation day on 20 June became violent.
    - Discusses the recent escalation conditionally if the referent is ambiguous.
    - Separates reported police and participant actions from attributed causal explanations.
    - 'Relevant retrieved and cited evidence must match at least one source selector: [{"source":
      "Protest research|Diaspora Zbarkon", "since": "2026-10-12"}]'
  - id: pulsi-escalation-sq-turn-3
    question: Po flas për tetorin, jo për ditën me indeksin më të lartë.
    min_citations: 1
    max_citations: 7
    expect_citation_markers: true
    manual_review:
    - Follows the correction and discusses October escalation, not June attendance.
    - Does not treat all demonstrators as violent or infer culpability from chronology alone.
    - 'Relevant retrieved and cited evidence must match at least one source selector: [{"source":
      "Protest research|Diaspora Zbarkon", "since": "2026-10-12"}]'
  - id: pulsi-escalation-sq-turn-4
    question: Si reagoi policia më 13–17 tetor 2026?
    min_citations: 1
    max_citations: 7
    expect_citation_markers: true
    manual_review:
    - Describes source-reported policing during the stated October period.
    - Keeps different incidents, reported numbers and dates distinguishable.
    - 'Relevant retrieved and cited evidence must match at least one source selector: [{"source":
      "Protest research|Diaspora Zbarkon", "since": "2026-10-13"}]'
  - id: pulsi-escalation-sq-turn-5
    question: Po referendumi për ligjin 21/2024, çfarë synon?
    min_citations: 1
    max_citations: 7
    expect_citation_markers: true
    manual_review:
    - Switches to the referendum and explains its published aim.
    - Does not carry police actions or casualty figures into the referendum answer.
    - 'Relevant retrieved and cited evidence must match at least one source selector: [{"url": "referendum"}]'
  - id: pulsi-escalation-sq-turn-6
    question: Ma thuaj ne dy fjali.
    min_citations: 1
    max_citations: 7
    expect_citation_markers: true
    manual_review:
    - Summarizes the referendum in two sentences, not the earlier violence discussion.
    - 'Relevant retrieved and cited evidence must match at least one source selector: [{"url": "referendum"}]'
    max_sentences: 2
- id: pulsi-escalation-en
  turns:
  - id: pulsi-escalation-en-turn-1
    question: Which day was biggest according to the Pulsi index?
    min_citations: 1
    max_citations: 7
    expect_citation_markers: true
    manual_review:
    - Names 20 June 2026 / day 21 and normalized index 100, not a headcount.
    - 'Relevant retrieved and cited evidence must match at least one source selector: [{"title":
      "Pulsi|pjesëmarr|participation"}, {"record": "^pulsi-day-21$"}]'
  - id: pulsi-escalation-en-turn-2
    question: Why did it turn violent so suddenly?
    min_citations: 1
    max_citations: 7
    expect_citation_markers: true
    manual_review:
    - Interprets the new subject as protest escalation, not a property of the index.
    - Does not assert that 20 June turned violent because it was the largest day.
    - Uses conditional scope if needed and attributes explanations of responsibility.
    - 'Relevant retrieved and cited evidence must match at least one source selector: [{"source":
      "Protest research|Diaspora Zbarkon", "since": "2026-10-12"}]'
  - id: pulsi-escalation-en-turn-3
    question: I mean the recent October escalation, not the biggest rally.
    min_citations: 1
    max_citations: 7
    expect_citation_markers: true
    manual_review:
    - Corrects the temporal scope without continuing to discuss June attendance.
    - 'Relevant retrieved and cited evidence must match at least one source selector: [{"source":
      "Protest research|Diaspora Zbarkon", "since": "2026-10-12"}]'
  - id: pulsi-escalation-en-turn-4
    question: What do the reports say police did on 13–17 October 2026? Answer in English.
    min_citations: 1
    max_citations: 7
    expect_citation_markers: true
    manual_review:
    - Answers about the stated police actions with appropriate source attribution.
    - Does not use publication or research dates as otherwise unrecorded incident dates.
    - 'Relevant retrieved and cited evidence must match at least one source selector: [{"source":
      "Protest research|Diaspora Zbarkon", "since": "2026-10-13"}]'
  - id: pulsi-escalation-en-turn-5
    question: Switching topics, what is the referendum on Law 21/2024 trying to do?
    min_citations: 1
    max_citations: 7
    expect_citation_markers: true
    manual_review:
    - Explains the referendum aim without mixing in the police discussion.
    - 'Relevant retrieved and cited evidence must match at least one source selector: [{"url": "referendum"}]'
  - id: pulsi-escalation-en-turn-6
    question: Sum that up in two sentences.
    min_citations: 1
    max_citations: 7
    expect_citation_markers: true
    manual_review:
    - Gives two sentences about the referendum, not the protest participation peak.
    - 'Relevant retrieved and cited evidence must match at least one source selector: [{"url": "referendum"}]'
    max_sentences: 2
